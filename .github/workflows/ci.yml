# CI: every push and pull request. The same three commands a contributor runs locally, then the
# Action itself against the two example projects.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: library (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node >=22 (Node 20 reached end-of-life on 2026-04-30).
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  action:
    name: the Action on the examples
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # No dist/ is committed on a branch, so the Action builds the CLI itself (that path is tested here).
      - name: Clean example passes
        uses: ./
        with:
          path: examples/clean-demo
          date: '2026-11-25'
      - name: Conflicting example fails
        id: conflict
        uses: ./
        continue-on-error: true
        with:
          path: examples/conflict-demo
          date: '2026-11-25'
      - name: The conflicting example must have failed
        run: test "${{ steps.conflict.outcome }}" = "failure"
      - name: Only some findings count when --fail-on is raised (Go has no pins here, so this passes)
        uses: ./
        with:
          path: examples/conflict-demo
          runtime: go
          fail-on: info
          date: '2026-11-25'
      - name: This repository passes its own check (the examples contain deliberate conflicts)
        uses: ./
        with:
          path: .
          exclude: examples
          date: '2026-11-25'
