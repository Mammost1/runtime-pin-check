# Copy to .github/workflows/pin-check.yml in your repository.
name: Runtime pins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Replace OWNER and the ref with the location of your copy of this repository.
      - uses: OWNER/runtime-pin-check@v0
        with:
          path: .
          fail-on: error            # error | warning | info
          # runtime: node,python    # default: all three
          # exclude: |              # one path or glob per line
          #   examples
          #   docs/**
          # date: 2026-11-25        # reproduce an end-of-life result on a fixed day
