name: runtime-pin-check
description: Find Node, Python and Go version pins that disagree across a repository's files, with file and line.
author: runtime-pin-check contributors
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Directory to scan, relative to the workspace.
    default: .
  fail-on:
    description: Fail the step when a finding is at or above this level (error, warning or info).
    default: error
  runtime:
    description: Comma-separated runtimes to check (node, python, go). Empty means all three.
    default: ''
  date:
    description: Check end-of-life and LTS aliases as of this date (YYYY-MM-DD). Empty means today (UTC).
    default: ''
  exclude:
    description: Paths or globs to skip, one per line (for example `examples` or `docs/**`).
    default: ''
  include-fixtures:
    description: Also scan fixtures/, __fixtures__/, testdata/ and test-fixtures/ (skipped by default).
    default: 'false'

runs:
  using: composite
  steps:
    # Node 24 is the runtime of the checker itself. Note that this changes `node` for the later steps of
    # your job; the CLI needs Node 22 or newer.
    - uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Prepare the CLI (build it on a branch ref; install the runtime dependencies on a release ref)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        if [ ! -f dist/cli.js ]; then
          echo "dist/cli.js is missing (a branch ref): installing and building"
          npm ci --no-audit --no-fund
          npm run build
        elif [ ! -d node_modules ]; then
          echo "Using the prebuilt dist/cli.js; installing its runtime dependencies"
          npm ci --omit=dev --no-audit --no-fund
        else
          echo "Using the prebuilt dist/cli.js"
        fi

    - name: Check runtime pins
      shell: bash
      env:
        # Inputs go through the environment, never into the script text.
        RPC_PATH: ${{ inputs.path }}
        RPC_FAIL_ON: ${{ inputs.fail-on }}
        RPC_RUNTIME: ${{ inputs.runtime }}
        RPC_DATE: ${{ inputs.date }}
        RPC_EXCLUDE: ${{ inputs.exclude }}
        RPC_INCLUDE_FIXTURES: ${{ inputs.include-fixtures }}
        RPC_CLI: ${{ github.action_path }}/dist/cli.js
      run: |
        set -uo pipefail
        args=("${RPC_PATH:-.}" --fail-on "${RPC_FAIL_ON:-error}")
        [ -n "$RPC_RUNTIME" ] && args+=(--runtime "$RPC_RUNTIME")
        [ -n "$RPC_DATE" ] && args+=(--date "$RPC_DATE")
        [ "$RPC_INCLUDE_FIXTURES" = "true" ] && args+=(--include-fixtures)
        while IFS= read -r line; do
          line="${line%$'\r'}"
          [ -n "$line" ] && args+=(--exclude "$line")
        done <<< "$RPC_EXCLUDE"

        report="$(mktemp)"
        # The CLI prints ::error / ::warning annotations itself when GITHUB_ACTIONS=true.
        node "$RPC_CLI" "${args[@]}" | tee "$report"
        code="${PIPESTATUS[0]}"

        # The same report, without the annotation lines, in the job summary.
        {
          echo '### runtime-pin-check'
          echo '```text'
          grep -v '^::' "$report"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
